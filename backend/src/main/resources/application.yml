    primary:
      driver-class-name: org.postgresql.Driver
      url: jdbc:postgresql://116.62.166.105:5432/df_database?reWriteBatchedInserts=true
      username: postgres
      password: vBX!1*!z22
    # 2. 数据存储库：用户导入/填报的物理表；etl_manage.report_department_user_list 等视图也在此库
    dynamic:
      driver-class-name: org.postgresql.Driver
      url: jdbc:postgresql://116.62.166.105:5432/my_data_analysis?reWriteBatchedInserts=true
      username: postgres
      password: vBX!1*!z22
